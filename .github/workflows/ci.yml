name: "CI"

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  code-format:
    name: Code Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Prepare
        run: |
          sudo apt install -y clang-format
      - name: Format
        run: |
          find src -iname "*.[h,c]" -exec clang-format -i {} \;
      - name: Check
        run: |
          git status
          git diff --quiet

  source:
    name: Source
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.base_ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      - name: Gen Source
        run: |
          REV_ID=$(git tag --points-at HEAD)
          if [ -z "${REV_ID}" ]; then
            REV_ID=$(git rev-parse --short HEAD)
          fi
          mkdir -p natmap-${{ env.BRANCH_NAME }}
          git ls-files --recurse-submodules | tar c -O -T- | tar x -C natmap-${{ env.BRANCH_NAME }}
          echo ${REV_ID} > natmap-${{ env.BRANCH_NAME }}/.version
          tar cJf natmap-${{ env.BRANCH_NAME }}.tar.xz natmap-${{ env.BRANCH_NAME }}
      - name: Upload source
        uses: actions/upload-artifact@v7
        with:
          name: natmap-${{ env.BRANCH_NAME }}.tar.xz
          path: natmap-${{ env.BRANCH_NAME }}.tar.xz
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: arm64
            tool: aarch64-unknown-linux-musl
          - name: arm32
            tool: arm-unknown-linux-musleabi
          - name: arm32hf
            tool: arm-unknown-linux-musleabihf
          - name: arm32v7
            tool: armv7-unknown-linux-musleabi
          - name: arm32v7hf
            tool: armv7-unknown-linux-musleabihf
          - name: i586
            tool: i586-unknown-linux-musl
          - name: i686
            tool: i686-unknown-linux-musl
          - name: loong64
            tool: loongarch64-unknown-linux-musl
          - name: m68k
            tool: m68k-unknown-linux-musl
          - name: microblazeel
            tool: microblazeel-xilinx-linux-musl
          - name: microblaze
            tool: microblaze-xilinx-linux-musl
          - name: mips64el
            tool: mips64el-unknown-linux-musl
          - name: mips64
            tool: mips64-unknown-linux-musl
          - name: mips32el
            tool: mipsel-unknown-linux-musl
          - name: mips32elsf
            tool: mipsel-unknown-linux-muslsf
          - name: mips32
            tool: mips-unknown-linux-musl
          - name: mips32sf
            tool: mips-unknown-linux-muslsf
          - name: or1k
            tool: or1k-unknown-linux-musl
          - name: powerpc64le
            tool: powerpc64le-unknown-linux-musl
          - name: powerpc64
            tool: powerpc64-unknown-linux-musl
          - name: powerpcle
            tool: powerpcle-unknown-linux-musl
          - name: powerpc
            tool: powerpc-unknown-linux-musl
          - name: riscv32
            tool: riscv32-unknown-linux-musl
          - name: riscv64
            tool: riscv64-unknown-linux-musl
          - name: s390x
            tool: s390x-ibm-linux-musl
          - name: sh4
            tool: sh4-multilib-linux-musl
          - name: x86_64
            tool: x86_64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      - name: Build ${{ matrix.name }}
        run: |
          sudo mkdir -p /opt/x-tools
          wget https://github.com/cross-tools/musl-cross/releases/download/20261001/${{ matrix.tool }}.tar.xz
          sudo tar xf ${{ matrix.tool }}.tar.xz -C /opt/x-tools
          make CROSS_PREFIX=/opt/x-tools/${{ matrix.tool }}/bin/${{ matrix.tool }}- CFLAGS=${{ matrix.env.CFLAGS }} ENABLE_STATIC=1 -j`nproc`
          cp bin/natmap natmap-linux-${{ matrix.name }}
      - name: Upload ${{ matrix.name }}
        uses: actions/upload-artifact@v7
        with:
          name: natmap-linux-${{ matrix.name }}
          path: natmap-linux-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 1

  windows-msvc-x64:
    name: Windows (MSVC, x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Setup GNU make for Win32
        shell: pwsh
        run: |
          choco install make --no-progress -y
          Add-Content $env:GITHUB_PATH "C:\Program Files\Git\usr\bin"
      - name: Build
        shell: cmd
        run: |
          make -j4 ARCH=x64
          copy bin\natmap.exe natmap-win-x64.exe
      - name: Upload x64
        uses: actions/upload-artifact@v7
        with:
          name: natmap-win-x64.exe
          path: natmap-win-x64.exe
          if-no-files-found: error
          retention-days: 1

  windows-msvc-x86:
    name: Windows (MSVC, x86)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Setup GNU make for Win32
        shell: pwsh
        run: |
          choco install make --no-progress -y
          Add-Content $env:GITHUB_PATH "C:\Program Files\Git\usr\bin"
      - name: Build
        shell: cmd
        run: |
          make -j4 ARCH=x86
          copy bin\natmap.exe natmap-win-x86.exe
      - name: Upload x86
        uses: actions/upload-artifact@v7
        with:
          name: natmap-win-x86.exe
          path: natmap-win-x86.exe
          if-no-files-found: error
          retention-days: 1

  windows-msvc-arm64:
    name: Windows (MSVC, arm64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64
      - name: Setup GNU make for Win32
        shell: pwsh
        run: |
          choco install make --no-progress -y
          Add-Content $env:GITHUB_PATH "C:\Program Files\Git\usr\bin"
      - name: Build
        shell: cmd
        run: |
          make -j4 ARCH=arm64
          copy bin\natmap.exe natmap-win-arm64.exe
      - name: Upload arm64
        uses: actions/upload-artifact@v7
        with:
          name: natmap-win-arm64.exe
          path: natmap-win-arm64.exe
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - name: arm64
            flags: -arch arm64 -mmacosx-version-min=11.0
          - name: x86_64
            flags: -arch x86_64 -mmacosx-version-min=10.7
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      - name: Build ${{ matrix.name }}
        run: |
          make CC=clang CFLAGS="${{ matrix.flags }}" LFLAGS="${{ matrix.flags }}" -j $(sysctl -n hw.logicalcpu)
          cp bin/natmap natmap-darwin-${{ matrix.name }}
      - name: Upload ${{ matrix.name }}
        uses: actions/upload-artifact@v7
        with:
          name: natmap-darwin-${{ matrix.name }}
          path: natmap-darwin-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 1

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      - name: Build
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y gmake gcc
          run: |
            gmake
            cp bin/natmap natmap-freebsd-x86_64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: natmap-freebsd-x86_64
          path: natmap-freebsd-x86_64
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - code-format
      - source
      - linux
      - windows-msvc-x64
      - windows-msvc-x86
      - windows-msvc-arm64
      - macos
      - freebsd
    if: github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: "natmap-*"
          merge-multiple: true
      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in release/natmap-*; do
            gh release upload ${{ github.event.release.tag_name }} $i
          done

  snapshot:
    name: Snapshot
    runs-on: ubuntu-latest
    needs:
      - code-format
      - source
      - linux
      - windows-msvc-x64
      - windows-msvc-x86
      - windows-msvc-arm64
      - macos
      - freebsd
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: "natmap-*"
          merge-multiple: true
      - name: Update snapshot tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f snapshot ${{ github.sha }}
          git push -f origin refs/tags/snapshot
      - name: Publish snapshot release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST=$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
          if [ -n "${LAST}" ]; then
            NOTES="Full Changelog: https://github.com/${{ github.repository }}/compare/${LAST}...snapshot"
          else
            NOTES="Full Changelog: https://github.com/${{ github.repository }}/commits/snapshot"
          fi
          gh release delete snapshot --yes || true
          gh release create snapshot --prerelease --verify-tag \
            --title snapshot --notes "${NOTES}" release/natmap-*

  android:
    name: Android
    runs-on: ubuntu-latest
    if: github.event_name != 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      - name: Prepare
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip android-ndk-r27d-linux.zip
          ln -sf . jni
      - name: Build
        run: |
          ./android-ndk-r27d/ndk-build

  llvm:
    name: LLVM
    runs-on: ubuntu-latest
    if: github.event_name != 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      - name: Prepare
        run: |
          sudo apt install -y clang
      - name: Build
        run: |
          make CC=clang ENABLE_STATIC=1 -j`nproc`

  docker-prepare:
    needs: linux
    runs-on: ubuntu-latest
    outputs:
      repo_name_lc: ${{ steps.set-repo.outputs.repo_name_lc }}
    steps:
      - name: Set lowercase repo name
        id: set-repo
        run: |
          REPO_NAME_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_name_lc=$REPO_NAME_LC" >> $GITHUB_OUTPUT

  docker-build-and-push:
    needs: docker-prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            natmap_arch: x86_64
          - arch: arm64
            natmap_arch: arm64
          - arch: arm
            natmap_arch: arm32v7
          - arch: riscv64
            natmap_arch: riscv64
          - arch: s390x
            natmap_arch: s390x
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          platforms: linux/${{ matrix.arch }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download built arch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: natmap-linux-${{matrix.natmap_arch}}
          path: ./tmp/artifact

      - name: Build and push platform-specific image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ needs.docker-prepare.outputs.repo_name_lc }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          build-args: |
            NATMAP_ARCH=${{ matrix.natmap_arch }}
          provenance: false
          sbom: false

      - name: Export Digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          ls -l /tmp/digests/

      - name: Upload Digest
        uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: docker-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    needs: [docker-prepare, docker-build-and-push]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Download Digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Prepare Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Format Docker Image Meta
        uses: docker/metadata-action@v5
        id: docker_meta
        with:
          images: ghcr.io/${{ needs.docker-prepare.outputs.repo_name_lc }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=nightly,enable={{is_default_branch}}
            type=ref,event=tag
      - name: Create Manifest List and Push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ needs.docker-prepare.outputs.repo_name_lc }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ needs.docker-prepare.outputs.repo_name_lc }}:${{ steps.docker_meta.outputs.version }}

      - name: Delete current run's built artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          sudo apt-get update && sudo apt-get install -y gh
          echo "Deleting docker-digests artifacts for run ID: $RUN_ID"

          gh api \
            "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            -q '.artifacts[] | select(.name | startswith("docker-digest")) | .id' |
          while read ARTIFACT_ID; do
            echo "Deleting artifact ID: $ARTIFACT_ID"
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID"
          done
